on: push

jobs:
  build-and-clang-tidy:
    runs-on: ubuntu-latest
    container: ghcr.io/iraspa/ubuntu-22-llvm-18:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y clang-tidy cmake ninja-build unzip g++

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -G Ninja

      - name: Build project
        run: cmake --build build

      - name: Run clang-tidy
        run: |
          cmake --build build --target tidy || true


  clang-format:
    runs-on: ubuntu-latest
    container: ghcr.io/iraspa/ubuntu-22-llvm-18:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y clang-format cmake ninja-build

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Run clang-format
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target clang-format